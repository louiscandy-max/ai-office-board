<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AI 辦公樓看板</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=261114225031">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="top">
  <h1>AI 辦公樓看板</h1>
  <div class="meta">
    <span id="updated">資料更新於：暫無數據</span>
    <button id="refresh" type="button">重新整理</button>
    <button id="lock" type="button" hidden>登出本機</button>
  </div>
  <div id="status" class="status" role="status"></div>
</header>

<section id="building-wrap">
  <div id="building" aria-label="三維開放式辦公區總覽"></div>
  <p class="hint">拖曳可旋轉、雙指可縮放，點選座位或工作看板查看內容</p>
  <p class="legend">左前：個人幕僚區｜左後：特殊小組區<br>右前：公司幕僚區｜右後：公司專業區<br>實線：直屬｜虛線：審核</p>
</section>

<section id="detail" class="card" hidden>
  <div class="detail-head">
    <h2 id="detail-title"></h2>
    <button id="detail-close" type="button">關閉</button>
  </div>
  <div id="detail-body"></div>
</section>

<main>
  <section class="card">
    <h2>各辦公室工作看板</h2>
    <div id="boards" class="boards"></div>
  </section>
  <section class="card">
    <h2>每個人在做什麼</h2>
    <div id="doing" class="grid"></div>
  </section>
  <section class="card">
    <h2>誰在等我</h2>
    <div id="waiting"></div>
  </section>
  <section class="card">
    <h2>每個人的任務流</h2>
    <div id="flow" class="grid"></div>
  </section>
</main>

<div id="gate" class="gate" hidden>
  <form id="gate-form" class="gate-box">
    <h2>請輸入通關密語</h2>
    <input id="pass" type="password" autocomplete="current-password" required aria-label="通關密語">
    <label class="remember"><input id="remember" type="checkbox"> 在這台裝置記住</label>
    <button type="submit">開啟看板</button>
    <p id="gate-msg" class="gate-msg"></p>
  </form>
</div>

<script type="module" src="app.js?v=261114225031"></script>
</body>
</html>
