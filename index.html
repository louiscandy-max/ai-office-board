<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AI 辦公樓看板</title>
<link rel="icon" href="data:,">
<script>(function(){var t='A';try{var q=(new URLSearchParams(location.search).get('theme')||'').toUpperCase();t=(q==='A'||q==='B')?q:(localStorage.getItem('aiOfficeBoard.theme')==='B'?'B':'A');}catch(e){}document.documentElement.dataset.theme=t;})();</script>
<link rel="stylesheet" href="style.css?v=2611160451">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header class="top">
  <h1><span class="yy" aria-hidden="true"></span>AI 辦公樓看板</h1>
  <div class="meta">
    <span id="live" class="live off"><i></i><b id="live-text">尚未解鎖</b></span>
    <span id="updated">資料更新於：暫無數據</span>
    <button id="refresh" type="button">立即更新</button>
    <button id="to-board" type="button" class="ghost">看大型看板</button>
    <button id="to-all" type="button" class="ghost">看全景</button>
    <span class="theme-sw" role="group" aria-label="切換模板"><button id="theme-a" type="button">模板 A 太極</button><button id="theme-b" type="button">模板 B 科技</button></span>
    <button id="lock" type="button" hidden>登出本機</button>
  </div>
  <div id="status" class="status" role="status"></div>
</header>

<section id="building-wrap">
  <div id="building" aria-label="三維開放式辦公區總覽"></div>
  <p class="hint">拖曳可旋轉、雙指可縮放，點選座位、成員或中央主位查看內容</p>
  <p class="legend">太極同層：<b>中央主位</b> Louis 最後來訊時間（一小時內有來訊即發光）<br><b>左半・陽</b> 個人側：PA、IA、Admin、Kobe、Fly｜<b>右半・陰</b> 公司側：CoS、CLO、CTO、CPO、FP&amp;A<br>後方 全員即時看板牆｜四隅 圓桌會議・書房・茶席・太極場｜金線：直屬｜朱紅虛線：PA 稽核 IA</p>
</section>

<section id="detail" class="card" hidden>
  <div class="detail-head">
    <h2 id="detail-title"></h2>
    <button id="detail-close" type="button">關閉</button>
  </div>
  <div id="detail-body"></div>
</section>

<main>
  <section class="card">
    <h2>每個人在做什麼</h2>
    <div id="doing" class="grid"></div>
  </section>
  <section class="card">
    <h2>警示</h2>
    <div id="alerts"></div>
  </section>
  <section class="card">
    <h2>誰在等我</h2>
    <div id="waiting"></div>
  </section>
  <section class="card">
    <h2>每個人的任務流</h2>
    <div id="flow" class="grid"></div>
  </section>
  <details class="card usage-card" open>
    <summary><h2>累計用量</h2></summary>
    <div id="usage" class="usage"></div>
  </details>
</main>

<div id="gate" class="gate" hidden>
  <form id="gate-form" class="gate-box">
    <h2>請輸入通關密語</h2>
    <input id="pass" type="password" autocomplete="current-password" required aria-label="通關密語">
    <label class="remember"><input id="remember" type="checkbox"> 在這台裝置記住</label>
    <button type="submit">開啟看板</button>
    <p id="gate-msg" class="gate-msg"></p>
  </form>
</div>

<script type="module" src="app.js?v=2611160451"></script>
</body>
</html>
